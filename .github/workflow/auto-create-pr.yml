name: Auto Create Pull Request

on:
  push:
    # Lắng nghe sự kiện push trên tất cả các nhánh, NGOẠI TRỪ nhánh main/master
    branches-ignore:
      - main
      - master

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Create Pull Request automatically
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "auto: create pull request for pushed branch"
          title: "PR: Merge ${{ github.ref_name }} into main"
          body: |
            Tự động tạo Pull Request từ nhánh `${{ github.ref_name }}`.
            
            - **Người thực hiện:** @${{ github.actor }}
            - **Commit:** ${{ github.sha }}
          branch: ${{ github.ref_name }}
          base: main