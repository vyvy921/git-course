name: Auto Create Pull Request

on:
  push:
    # Bỏ qua khi push trực tiếp vào main hoặc master
    branches-ignore:
      - main
      - master

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Kiểm tra xem nhánh này đã có Pull Request mở sẵn hay chưa
          PR_EXISTS=$(gh pr list --head "${{ github.ref_name }}" --base main --state open --json number -q '.[0].number')
          
          if [ -z "$PR_EXISTS" ]; then
            echo "Creating Pull Request for branch ${{ github.ref_name }}..."
            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "PR: Merge ${{ github.ref_name }} into main" \
              --body "Tự động tạo PR từ commit ${{ github.sha }} bởi @${{ github.actor }}."
          else
            echo "Pull Request already exists for this branch (PR #$PR_EXISTS). Skipping creation."
          fi